<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto 16 - Desplegable Personalizado</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dropdown-wrapper">
      <h2>Selecciona una Materia</h2>

      <div class="custom-dropdown" id="customDropdown">
        <!-- Estado por defecto / seleccionado (Cabecera) -->
        <div class="dropdown-header" id="dropdownHeader">
          <span id="selectedText">Selecciona una materia</span>
          <span class="arrow" id="dropdownArrow">˅</span>
        </div>

        <!-- Estado abierto (Lista de opciones) -->
        <div class="dropdown-list" id="dropdownList">
          <div class="dropdown-item" data-value="Matemáticas">Matemáticas</div>
          <div class="dropdown-item" data-value="Ciencias Naturales">
            Ciencias Naturales
          </div>
          <div class="dropdown-item" data-value="Lenguaje y Literatura">
            Lenguaje y Literatura
          </div>
          <div class="dropdown-item" data-value="Ciencias Sociales">
            Ciencias Sociales
          </div>
          <div class="dropdown-item" data-value="Inglés">Inglés</div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
